<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Table Generator</title>
    <style>
        table { border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #555; min-width: 48px; padding: 8px; text-align: center; }
    </style>
</head>
<body>
    <h1>Dynamic Table Generator</h1>
    <label for="rows">Rows:</label>
    <input id="rows" type="number" min="1" max="20" value="3">
    <label for="columns">Columns:</label>
    <input id="columns" type="number" min="1" max="20" value="4">
    <button id="generate" type="button">Generate table</button>
    <p id="message" aria-live="polite"></p>
    <div id="tableArea"></div>
    <script>
        document.querySelector("#generate").addEventListener("click", () => {
            const rows = Number(document.querySelector("#rows").value);
            const columns = Number(document.querySelector("#columns").value);
            const area = document.querySelector("#tableArea");
            const message = document.querySelector("#message");
            area.replaceChildren();
            if (!Number.isInteger(rows) || !Number.isInteger(columns) || rows < 1 || rows > 20 || columns < 1 || columns > 20) {
                message.textContent = "Enter whole numbers from 1 to 20.";
                return;
            }
            message.textContent = "";
            const table = document.createElement("table");
            for (let rowIndex = 0; rowIndex < rows; rowIndex++) {
                const row = document.createElement("tr");
                for (let columnIndex = 0; columnIndex < columns; columnIndex++) {
                    const cell = document.createElement(rowIndex === 0 ? "th" : "td");
                    cell.textContent = rowIndex === 0 ? `Column ${columnIndex + 1}` : `R${rowIndex + 1}, C${columnIndex + 1}`;
                    row.appendChild(cell);
                }
                table.appendChild(row);
            }
            area.appendChild(table);
        });
    </script>
</body>
</html>
