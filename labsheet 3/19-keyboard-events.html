<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Events</title>
</head>
<body>
    <h1>Keyboard Event Viewer</h1>
    <p>Press any key while this page is focused.</p>
    <p id="key" aria-live="polite">Key: none</p>
    <p id="code">Code: none</p>
    <p id="state">State: waiting</p>
    <script>
        document.addEventListener("keydown", event => {
            document.querySelector("#key").textContent = `Key: ${event.key}`;
            document.querySelector("#code").textContent = `Code: ${event.code}`;
            document.querySelector("#state").textContent = "State: keydown";
        });
        document.addEventListener("keyup", event => {
            document.querySelector("#key").textContent = `Key: ${event.key}`;
            document.querySelector("#code").textContent = `Code: ${event.code}`;
            document.querySelector("#state").textContent = "State: keyup";
        });
    </script>
</body>
</html>
