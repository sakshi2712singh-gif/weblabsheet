<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Match Validation</title>
</head>
<body>
    <h1>Password Validation</h1>
    <form id="form" novalidate>
        <label for="password">Password:</label>
        <input id="password" type="password" required>
        <label for="confirm">Confirm password:</label>
        <input id="confirm" type="password" required>
        <p id="message" aria-live="polite"></p>
        <button type="submit">Submit</button>
    </form>
    <script>
        const form = document.querySelector("#form");
        const password = document.querySelector("#password");
        const confirm = document.querySelector("#confirm");
        const message = document.querySelector("#message");
        function validate() {
            if (!password.value || !confirm.value) message.textContent = "Both fields are required.";
            else message.textContent = password.value === confirm.value ? "Passwords match." : "Passwords do not match.";
            confirm.setCustomValidity(password.value === confirm.value ? "" : "Passwords do not match.");
        }
        password.addEventListener("input", validate);
        confirm.addEventListener("input", validate);
        form.addEventListener("submit", event => {
            event.preventDefault();
            validate();
            if (form.checkValidity() && password.value) message.textContent = "Form submitted successfully.";
            else confirm.reportValidity();
        });
    </script>
</body>
</html>
