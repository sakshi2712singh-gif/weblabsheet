# Add this block to Apache's httpd-vhosts.conf and update the path if needed.
<VirtualHost *:80>
    ServerName collegeweb.local
    DocumentRoot "C:/Users/Dell/Downloads/web lab/labsheet 4"

    <Directory "C:/Users/Dell/Downloads/web lab/labsheet 4">
        Options FollowSymLinks
        AllowOverride None
        Require local
        DirectoryIndex index.php index.html
    </Directory>

    <Directory "C:/Users/Dell/Downloads/web lab/labsheet 4/uploads">
        Options -Indexes
        AllowOverride None
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog "logs/collegeweb-error.log"
    CustomLog "logs/collegeweb-access.log" common
</VirtualHost>

# Add "127.0.0.1 collegeweb.local" to
# C:\Windows\System32\drivers\etc\hosts, then restart Apache.
