<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login</title>
  <style>
    *{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:22px;background:#e8f0ed;color:#20363c;font:15px "Segoe UI",sans-serif}.login-card{position:relative;width:min(100%,400px);padding:42px 36px 34px;border:1px solid #d5e1db;border-radius:12px;background:#fff;box-shadow:0 22px 58px rgb(23 62 67 / 16%)}.marker{position:absolute;top:-13px;right:26px;padding:7px 12px;border-radius:3px;background:#d96e4d;color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em}h1{margin:0 0 8px;color:#17685e;font:600 32px Georgia,serif}.intro{margin:0 0 26px;color:#627575}label{display:block;margin:16px 0 6px;font-weight:650}input{width:100%;padding:12px;border:1px solid #b9c9c2;border-radius:5px;font:inherit}input:focus{outline:3px solid #d8eee5;border-color:#24816e}button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:5px;background:#17685e;color:white;font:700 15px "Segoe UI",sans-serif;cursor:pointer}
  </style>
</head>
<body>
  <main class="login-card"><span class="marker">MEMBER ACCESS</span><h1>Welcome back</h1><p class="intro">Sign in to continue to your account.</p><form action="#" method="get"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" required><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></main>
</body>
</html>
