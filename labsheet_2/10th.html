<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Entry Table</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:38px 16px;background:#edf2f1;color:#213a3c;font:15px "Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:28px;background:white;border-radius:8px}h1{margin:0 0 20px;color:#17685e;font:600 30px Georgia,serif}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}caption{padding:0 0 12px;text-align:left;color:#677a77}th,td{padding:12px 14px;border-bottom:1px solid #d8e2de}th{background:#dfece6;color:#23494a;font-size:13px;text-transform:uppercase}tbody tr:nth-child(even){background:#f1f6f3}tbody tr:hover{background:#e4f1eb}input{width:100%;min-width:80px;padding:8px;border:1px solid #bdcbc5;border-radius:3px;font:inherit}button{margin-top:18px;padding:11px 17px;border:0;border-radius:4px;background:#17685e;color:white;font-weight:700}
  </style>
</head>
<body>
  <main><h1>Workshop attendance</h1><form action="#" method="get"><div class="table-wrap"><table><caption>Enter attendance for each participant.</caption><thead><tr><th scope="col">Participant</th><th scope="col">Email</th><th scope="col">Hours</th></tr></thead><tbody><tr><td><label for="person-a">Ari Kim</label></td><td><input id="email-a" name="email-a" type="email" aria-label="Ari Kim email"></td><td><input id="person-a" name="hours-a" type="number" min="0" max="8" value="4" aria-label="Ari Kim hours"></td></tr><tr><td><label for="person-b">Sam Lee</label></td><td><input id="email-b" name="email-b" type="email" aria-label="Sam Lee email"></td><td><input id="person-b" name="hours-b" type="number" min="0" max="8" value="6" aria-label="Sam Lee hours"></td></tr><tr><td><label for="person-c">Jo Patel</label></td><td><input id="email-c" name="email-c" type="email" aria-label="Jo Patel email"></td><td><input id="person-c" name="hours-c" type="number" min="0" max="8" value="3" aria-label="Jo Patel hours"></td></tr></tbody></table></div><button type="submit">Save attendance</button></form></main>
</body>
</html>
