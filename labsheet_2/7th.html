<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form Focus States</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px 16px;background:#f3f1e9;color:#283a3a;font:16px/1.5 "Segoe UI",sans-serif}main{max-width:560px;margin:auto;padding:30px;background:#fff;border-radius:7px}h1{margin:0;color:#a44f35;font:600 30px Georgia,serif}p{margin:8px 0 24px;color:#64716e}label{display:block;margin:17px 0 6px;font-weight:700}input,textarea{width:100%;padding:12px;border:1px solid #bec9c4;border-radius:4px;background:#fff;font:inherit;transition:border-color .18s ease,background-color .18s ease,box-shadow .18s ease}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus{outline:none;border-color:#bd613f;background:#fff8f1;box-shadow:0 0 0 3px rgb(189 97 63 / 15%)}button{margin-top:20px;padding:12px 18px;border:0;border-radius:4px;background:#a44f35;color:white;font:700 14px "Segoe UI",sans-serif}
  </style>
</head>
<body>
  <main><h1>Share your feedback</h1><p>Your notes help us improve the experience.</p><form action="#" method="get"><label for="feedback-name">Name</label><input id="feedback-name" name="name" autocomplete="name"><label for="feedback-email">Email</label><input id="feedback-email" name="email" type="email"><label for="feedback-message">Your feedback</label><textarea id="feedback-message" name="message" required></textarea><button type="submit">Send feedback</button></form></main>
</body>
</html>
