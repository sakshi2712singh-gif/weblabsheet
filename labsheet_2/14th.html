<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Range and Number Input</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px 16px;background:#f2f4ef;color:#243a3b;font:16px "Segoe UI",sans-serif}main{max-width:560px;margin:auto;padding:30px;background:white;border-radius:8px}h1{margin:0;color:#17685e;font:600 30px Georgia,serif}p{color:#627673}label{display:block;margin:18px 0 7px;font-weight:700}.range-row{display:flex;align-items:center;gap:18px}input[type=range]{flex:1;accent-color:#17685e}input[type=number]{width:100px;padding:10px;border:1px solid #bdcbc5;border-radius:4px;font:inherit}output{display:inline-block;min-width:88px;color:#17685e;font-size:22px;font-weight:700}small{color:#687a76}
  </style>
</head>
<body>
  <main><h1>Set your weekly goal</h1><p>Adjust either control; the value and unit update together.</p><form action="#" method="get"><label for="goal-range">Study hours per week</label><div class="range-row"><input id="goal-range" name="hours-range" type="range" min="1" max="40" value="8"><output id="goal-output" for="goal-range goal-number">8 hours</output></div><label for="goal-number">Enter a number of hours</label><input id="goal-number" name="hours" type="number" min="1" max="40" value="8"><small>Choose from 1 to 40 hours.</small></form></main>
  <script>
    const range = document.querySelector("#goal-range");
    const number = document.querySelector("#goal-number");
    const output = document.querySelector("#goal-output");
    function updateGoal(source, target) {
      const value = Math.min(40, Math.max(1, Number(source.value) || 1));
      source.value = value;
      target.value = value;
      output.value = `${value} ${value === 1 ? "hour" : "hours"}`;
    }
    range.addEventListener("input", () => updateGoal(range, number));
    number.addEventListener("input", () => updateGoal(number, range));
  </script>
</body>
</html>
