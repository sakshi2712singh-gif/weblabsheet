<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | HTML5 Validation</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 16px; background: #eff4f1; color: #20363b; font-family: "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: auto; padding: 30px; border: 1px solid #d5e1db; border-radius: 8px; background: white; }
    h1 { margin-top: 0; color: #1a6a5c; font-family: Georgia, serif; }
    label { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 700; }
    input { width: 100%; padding: 11px; border: 1px solid #b7c7c1; border-radius: 4px; font: inherit; }
    input:focus { outline: 3px solid #d9eee7; border-color: #247c69; }
    button { margin-top: 22px; padding: 12px 18px; border: 0; border-radius: 4px; background: #17685e; color: white; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Student Registration</h1>
    <form action="#" method="get">
      <label for="student-name">Full name</label>
      <input id="student-name" name="name" type="text" required minlength="3" maxlength="50" pattern="[A-Za-z ]{3,50}" title="Use 3 to 50 letters and spaces.">
      <label for="student-email">Email address</label>
      <input id="student-email" name="email" type="email" required maxlength="100" autocomplete="email">
      <label for="student-password">Password</label>
      <input id="student-password" name="password" type="password" required minlength="8" maxlength="20" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,20}" title="Use 8 to 20 characters with uppercase, lowercase, and a number.">
      <button type="submit">Register</button>
    </form>
  </main>
</body>
</html>
