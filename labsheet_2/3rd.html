<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Legacy Frameset Layout</title>
</head>
<frameset rows="76,*" frameborder="0" border="0">
  <frame src="3rd-header.html" name="header" title="Site header" scrolling="no">
  <frameset cols="210,*" frameborder="0" border="0">
    <frame src="3rd-nav.html" name="navigation" title="Navigation">
    <frame src="3rd-content.html" name="content" title="Main content">
  </frameset>
  <noframes>
    <body><p>This legacy frameset example requires a browser with frameset support.</p></body>
  </noframes>
</frameset>
</html>
