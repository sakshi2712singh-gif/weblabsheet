<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Typography</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:38px 16px;background:#f2f2e9;color:#283c3a;font:16px/1.6 "Trebuchet MS","Segoe UI",sans-serif}main{max-width:580px;margin:auto;padding:30px;background:white;border-radius:8px}h1{margin:0 0 8px;color:#9b5238;font:600 31px Georgia,serif}p{color:#61736e}label{display:block;margin:17px 0 6px;font-family:"Trebuchet MS",sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}input,textarea{width:100%;padding:12px;border:1px solid #c1cbc4;border-radius:4px;font:15px/1.5 "Trebuchet MS","Segoe UI",sans-serif}input::placeholder,textarea::placeholder{color:#76827b;font-family:Georgia,serif;font-style:italic;letter-spacing:.02em}input:focus,textarea:focus{outline:3px solid #f3e4d9;border-color:#aa5a3d}button{margin-top:20px;padding:12px 18px;border:0;border-radius:4px;background:#9b5238;color:white;font:700 13px "Trebuchet MS",sans-serif;letter-spacing:.05em;text-transform:uppercase}
  </style>
</head>
<body>
  <main><h1>Join our community</h1><p>Set up your learner profile.</p><form action="#" method="get"><label for="type-name">Full name</label><input id="type-name" name="name" placeholder="Your name"><label for="type-email">Email address</label><input id="type-email" name="email" type="email" placeholder="you@example.com"><label for="type-interest">Area of interest</label><textarea id="type-interest" name="interest" rows="4" placeholder="What would you like to learn?"></textarea><button type="submit">Create profile</button></form></main>
</body>
</html>
