<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf3f0;color:#21383b;font:15px/1.55 "Segoe UI",sans-serif}.top{padding:20px 7%;background:#193e46;color:white}.contact-layout{display:flex;max-width:1100px;min-height:calc(100vh - 65px);margin:auto;padding:56px 28px;gap:50px}.contact-form{flex:1.2;padding-right:50px;border-right:1px solid #ccd9d3}.location{flex:.8;padding-top:8px}h1{margin:0;color:#17685e;font:600 34px Georgia,serif}.location h2{margin-top:34px;color:#17685e;font:600 22px Georgia,serif}.intro{color:#667a76}label{display:block;margin:17px 0 6px;font-weight:700}input,textarea{width:100%;padding:11px;border:1px solid #b8c9c1;border-radius:4px;background:white;font:inherit}textarea{min-height:120px;resize:vertical}button{margin-top:18px;padding:12px 19px;border:0;border-radius:4px;background:#17685e;color:white;font-weight:700}@media(max-width:700px){.contact-layout{display:block;padding:34px 20px}.contact-form{padding:0 0 34px;border-right:0;border-bottom:1px solid #ccd9d3}.location{padding-top:28px}}
  </style>
</head>
<body>
  <header class="top"><strong>FIELDNOTES</strong> &nbsp; Contact</header>
  <main class="contact-layout"><section class="contact-form"><h1>Let's talk</h1><p class="intro">Send a note to our team and we will get back to you.</p><form action="#" method="get"><label for="contact-us-name">Name</label><input id="contact-us-name" name="name" autocomplete="name" required><label for="contact-us-email">Email</label><input id="contact-us-email" name="email" type="email" autocomplete="email" required><label for="contact-us-message">Message</label><textarea id="contact-us-message" name="message" required></textarea><button type="submit">Send message</button></form></section><aside class="location"><p class="intro">VISIT OUR STUDIO</p><h2>Find us</h2><address>48 Market Street<br>Portland, OR 97204<br>United States</address><h2>Hours</h2><p>Monday–Friday<br>9:00 am–5:00 pm</p><p>hello@example.test</p></aside></main>
</body>
</html>
