<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expanding Search</title>
  <style>
    *{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;background:#eef3f0;color:#20383d;font:16px "Segoe UI",sans-serif}.search{display:flex;align-items:center;gap:10px;padding:20px;border:1px solid #d7e2dc;border-radius:8px;background:white;box-shadow:0 12px 34px rgb(31 63 58 / 9%)}.search label{font-weight:700}.search input{width:170px;padding:11px 12px;border:1px solid #bdcbc5;border-radius:4px;font:inherit;transition:width .28s ease,border-color .18s ease,box-shadow .18s ease}.search input:focus{width:min(42vw,340px);outline:none;border-color:#17685e;box-shadow:0 0 0 3px #d9eee5}.search button{padding:11px 14px;border:0;border-radius:4px;background:#17685e;color:white;font-weight:700}
  </style>
</head>
<body>
  <form class="search" action="#" method="get" role="search"><label for="site-search">Search</label><input id="site-search" name="q" type="search" placeholder="Search courses"><button type="submit">Go</button></form>
</body>
</html>
