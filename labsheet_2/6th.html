<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Column CSS Grid Form</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:34px 16px;background:#f2f5f1;color:#233a40;font:15px "Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:30px;border-radius:8px;background:#fff}h1{margin:0 0 8px;color:#17685e;font:600 30px Georgia,serif}.hint{margin:0 0 24px;color:#647876}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}.field label{display:block;margin-bottom:7px;font-weight:700}.field input,.field select{width:100%;min-height:43px;padding:10px;border:1px solid #b8c8c1;border-radius:4px;font:inherit}.wide{grid-column:1/-1}button{padding:12px 18px;border:0;border-radius:4px;background:#17685e;color:white;font:700 14px "Segoe UI",sans-serif}@media(max-width:560px){main{padding:24px 18px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <main><h1>Contact details</h1><p class="hint">Complete the fields below to create your profile.</p><form class="form-grid" action="#" method="get"><div class="field"><label for="given-name">First name</label><input id="given-name" name="first-name" required></div><div class="field"><label for="family-name">Last name</label><input id="family-name" name="last-name" required></div><div class="field"><label for="grid-email">Email</label><input id="grid-email" name="email" type="email" required></div><div class="field"><label for="grid-program">Program</label><select id="grid-program" name="program"><option>Web development</option><option>Design</option><option>Data science</option></select></div><div class="field wide"><label for="grid-note">Notes</label><input id="grid-note" name="note"></div><div class="wide"><button type="submit">Save details</button></div></form></main>
</body>
</html>
