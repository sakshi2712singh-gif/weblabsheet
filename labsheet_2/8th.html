<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload Form</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px 16px;background:#edf3f2;color:#213b40;font:15px "Segoe UI",sans-serif}main{max-width:540px;margin:auto;padding:32px;border:1px solid #d2dfda;border-radius:8px;background:#fff}h1{margin:0 0 8px;color:#17685e;font:600 30px Georgia,serif}p{margin:0 0 24px;color:#687c79}label{display:block;margin-bottom:8px;font-weight:700}input[type=file]{width:100%;padding:14px;border:1px dashed #8ca9a0;border-radius:5px;background:#f8fbf9}button{margin-top:22px;padding:12px 20px;border:0;border-radius:4px;background:#17685e;color:#fff;font:700 14px "Segoe UI",sans-serif;cursor:pointer;transition:background-color .18s ease,transform .12s ease,box-shadow .18s ease}button:hover{background:#0f554c;box-shadow:0 5px 14px rgb(23 104 94 / 22%)}button:active{transform:translateY(2px);box-shadow:none}
  </style>
</head>
<body>
  <main><h1>Upload a document</h1><p>Choose a file to attach to your application.</p><form action="#" method="post" enctype="multipart/form-data"><label for="document">Document file</label><input id="document" name="document" type="file" accept=".pdf,.jpg,.png" required><button type="submit">Upload document</button></form></main>
</body>
</html>
