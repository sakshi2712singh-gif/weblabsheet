<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Subscription</title>
  <style>
    *{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;background:#eff3ec;color:#213a3b;font:15px/1.5 "Segoe UI",sans-serif}.widget{width:min(100%,520px);padding:34px;border:1px solid #d5e1d9;border-radius:8px;background:white;box-shadow:0 18px 42px rgb(34 66 58 / 10%)}.eyebrow{margin:0 0 8px;color:#b2573c;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;color:#17685e;font:600 30px Georgia,serif}.widget>p:not(.eyebrow){margin:10px 0 26px;color:#647975}.floating-field{position:relative;padding-top:8px}.floating-field input{width:100%;height:54px;padding:18px 13px 8px;border:1px solid #b9c9c1;border-radius:4px;background:transparent;font:inherit}.floating-field label{position:absolute;top:24px;left:13px;padding:0 4px;color:#687b76;pointer-events:none;transform-origin:left center;transition:top .16s ease,transform .16s ease,color .16s ease;background:white}.floating-field input:focus{outline:3px solid #dcefe6;border-color:#17685e}.floating-field input:focus+label,.floating-field input:not(:placeholder-shown)+label{top:1px;color:#17685e;transform:scale(.84)}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:4px;background:#17685e;color:white;font:700 14px "Segoe UI",sans-serif;cursor:pointer}button:hover{background:#10574f}
  </style>
</head>
<body>
  <main class="widget"><p class="eyebrow">Fieldnotes monthly</p><h1>Ideas for curious minds.</h1><p>A short note with new lessons, useful links, and upcoming events.</p><form action="#" method="get"><div class="floating-field"><input id="newsletter-email" name="email" type="email" placeholder=" " autocomplete="email" required><label for="newsletter-email">Email address</label></div><button type="submit">Subscribe</button></form></main>
</body>
</html>
